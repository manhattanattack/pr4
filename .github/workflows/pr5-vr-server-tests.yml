name: PR5 VR server tests

on:
  push:
    branches: [pr5]
  pull_request:
    branches: [main]

jobs:
  node-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Assets/MazeServer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: node --check server.js
      - run: node --check TankMob.js
